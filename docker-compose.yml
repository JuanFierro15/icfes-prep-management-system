services:

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: gestionicfes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tamao
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestionicfes"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/gestionicfes
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: tamao
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
